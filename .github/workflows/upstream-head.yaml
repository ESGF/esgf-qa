name: Upstream head compatibility

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  test-upstream-head:
    name: Python 3.13 with upstream development branches
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up released dependency environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci/requirements/environment.yml
          create-args: >-
            python=3.13
          environment-name: esgf-qa-upstream
          cache-downloads: true
          cache-downloads-key: "${{ runner.os }}-${{ runner.arch }}-upstream-py3.13"

      - name: Replace released checkers with upstream development versions
        run: |
          micromamba run -n esgf-qa-upstream python -m pip install \
            --force-reinstall \
            --no-deps \
            -r ci/requirements/upstream-head.txt

      - name: Install esgf-qa
        run: micromamba run -n esgf-qa-upstream python -m pip install --no-deps -e .

      - name: Show installed versions
        run: |
          micromamba info
          micromamba list -n esgf-qa-upstream

      - name: Run compatibility tests
        run: micromamba run -n esgf-qa-upstream pytest -rA
